name: Release

# Trusted publishing: npm trusts this repository's `release.yml` in the `npm`
# environment, so no token is stored anywhere and nothing here reads a secret.
# A trusted publisher is added in a package's own settings on npmjs.com, so the
# first version is published by a person and this workflow publishes the ones
# after it. VERSIONING.md § Releasing has all three things that must be in place.
#
# That first version's tag is pushed once the version is on npm, so a tag whose
# version is already there is a run with nothing to publish, not a failure.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancelled: a run cancelled mid-publish can leave a release half-landed,
# and npm never lets a version number be reused.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A fork can push a tag to itself; it must not build what this
    # repository's trust policy would then be asked to publish.
    if: github.repository == 'sigrix-io/gatehouse'
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: The tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      # Only an answer equal to the version skips: a lookup that fails for any
      # other reason publishes, and npm refuses a version it already has.
      - name: Publish, unless this version is already on npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::$name@$version is already on npm, so this run publishes nothing."
          else
            npm publish
          fi
