name: Release

# Trusted publishing: npm trusts this repository's `release.yml` in the `npm`
# environment, so no token is stored anywhere and nothing here reads a secret.
# A trusted publisher is added in a package's own settings on npmjs.com, so the
# first version is published by a person and this workflow publishes the ones
# after it. VERSIONING.md § Releasing has all three things that must be in place.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: The tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm publish
